<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Particle Heart (Core + Aura)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <audio
      id="bgAmbient"
      src="music/nen.m4a"
      loop
      preload="auto"
      playsinline
    ></audio>
    <audio
      id="bgHighlight"
      src="music/valentine.m4a"
      preload="auto"
      playsinline
    ></audio>

    <!-- ===== Background Image Layer ===== -->
    <div class="bg-layer" id="bgLayer">
      <img src="images/1.jpg" />
      <img src="images/2.jpg" />
      <img src="images/3.jpg" />
      <img src="images/4.jpg" />
      <img src="images/5.jpg" />
      <img src="images/6.jpg" />
      <img src="images/7.jpg" />
      <img src="images/8.jpg" />
      <img src="images/9.jpg" />
      <img src="images/10.jpg" />
      <img src="images/11.jpg" />
      <img src="images/12.jpg" />
      <img src="images/13.jpg" />
      <img src="images/14.jpg" />
      <img src="images/15.jpg" />
      <img src="images/16.jpg" />
      <img src="images/17.jpg" />
      <img src="images/18.jpg" />
      <img src="images/19.jpg" />
      <img src="images/20.jpg" />
      <img src="images/21.jpg" />
      <img src="images/22.jpg" />
      <img src="images/23.jpg" />
      <img src="images/24.jpg" />
      <img src="images/25.jpg" />
      <img src="images/26.jpg" />
      <img src="images/27.jpg" />
      <img src="images/28.jpg" />
      <img src="images/29.jpg" />
      <img src="images/30.jpg" />
      <img src="images/31.jpg" />
      <img src="images/32.jpg" />
      <img src="images/33.jpg" />
      <img src="images/34.jpg" />
    </div>

    <!-- ===== Center Envelope Button ===== -->
    <button
      class="envelope"
      id="envelopeBtn"
      aria-label="Open Valentine letter"
    >
      <span class="envelope-icon">💌</span>
    </button>

    <!-- ===== Letter Overlay + 3D Envelope Popup ===== -->
    <div class="letter-overlay" id="letterOverlay" aria-hidden="true">
      <div
        class="envelope-wrapper"
        id="envelopeWrapper"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
      >
        <div class="letter-envelope" id="letterEnvelope">
          <!-- flap (nắp phong bì) -->
          <div class="letter-flap"></div>

          <!-- body phong bì -->
          <div class="letter-envelope-body"></div>

          <!-- paper trượt lên -->
          <div class="letter-paper">
            <!-- hearts rơi nhẹ trong popup -->
            <div
              class="floating-hearts"
              id="floatingHearts"
              aria-hidden="true"
            ></div>

            <div class="letter-content">
              <div class="letter-header shine-text">Valentine❤️ Gửi em,</div>
              Chúng ta đã quen nhau
              <span id="loveTime"></span>.

              <!-- typewriter text -->
              <div class="letter-body" id="typeText"></div>

              <div class="letter-sign">— Anh yêu em</div>

              <button class="letter-close" id="letterCloseBtn">
                Đóng thư để tải kỷ niệm
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Floating Words Layer (fireworks + join flow) ===== -->
    <div class="floating-words" id="floatingWords" aria-hidden="true"></div>

    <!-- ===== Particle Heart Canvas ===== -->
    <canvas id="c"></canvas>

    <!-- ===== Overlay khi phóng to ảnh ===== -->
    <div class="image-overlay" id="imageOverlay"></div>

    <script src="heart.js"></script>
  </body>
</html>
